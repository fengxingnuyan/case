  function mergeRanges(ranges,duration){const merged=[];for(const r of cleanRanges(ranges,duration)){const last=merged.at(-1);if(last&&r[0]<=last[1]+1e-6)last[1]=Math.max(last[1],r[1]);else merged.push([...r]);}return merged;}

  function source(v){const local=localMedia.get(v.id);if(local)return local;const src=typeof v.src==='string'?v.src.trim():'';if(!src||/^(?:javascript|data|file):/i.test(src))return null;if(/^[a-z][a-z\d+.-]*:/i.test(src)&&!/^https?:/i.test(src))return null;return {url:src,signature:'url:'+src,name:v.filename,local:false};}

      map:`<path d="M300 155 151 76M300 155l154-65M300 155 159 246M300 155l152 78" opacity=".5"/>${[[151,76],[454,90],[159,246],[452,233]].map(([x,y])=>`<rect x="${x-44}" y="${y-25}" width="88" height="50" rx="8" fill="var(--art-paper,#fbfcf6)"/><path d="M${x-26} ${y-5}h53M${x-26} ${y+8}h36" opacity=".5" stroke-width="3"/>`).join('')}<circle cx="300" cy="155" r="52" fill="var(--art-accent,#b5c6b7)" opacity=".7"/><circle cx="300" cy="155" r="32"/><path d="M280 155h40M300 135v40"/>`,

  function myCourses(){const mine=plans.map(courseBy).filter(Boolean);return `<div class="page-header"><div><h1>我的课程</h1><p>从上次浏览的课时继续，学会方法，再完成一次实操。</p></div><a class="plain-link" href="#courses">发现课程 ${icon('arrow')}</a></div>${recentCard()}<div class="section-head"><div><h2>我的课程 <span class="tab-count">${mine.length}</span></h2><p>课程与浏览记录保存在当前浏览器，浏览不计作完课。</p></div></div>${mine.length?`<div class="lc-my-grid">${mine.map(c=>{const p=courseProgress(c),count=browseCount(c),media=hasMedia(c),v=videoBy(nextVideo(c)),seen=count>0||p.percentage>0;return `<article class="panel lc-my-course"><div class="eyebrow">${esc(courseCategory(c))}</div><h3><a href="#course/${c.id}">${esc(c.title)}</a></h3><p>${seen&&v?'上次课时：'+esc(v.title):'已加入我的课程，选择第一课开始学习。'}</p>${media&&p.percentage?`<div class="progress-line"><span style="width:${p.percentage}%"></span></div><div class="lc-my-progress"><span>已完成 ${p.done} / ${p.total} 节</span><span>已观看 ${p.percentage}%</span></div>`:`<div class="lc-browse-summary"><span>${count?'已浏览 '+count+' / '+modules(c).length+' 节':modules(c).length+' 节视频课'}</span><span>视频学习 → 端砚实操</span></div>`}<div class="button-row"><a class="btn primary small" href="${learningLink(c)}">${seen?'继续学习':'开始学习'} ${icon('arrow')}</a><a class="plain-link" href="#course/${c.id}">查看课程</a>${completionLink(c)}</div>${removeControls(c)}</article>`;}).join('')}</div>`:`<div class="empty"><h3>把想学的课程留在这里</h3><p>发现感兴趣的课程，加入后即可随时回来继续。</p><a class="btn primary" href="#courses">发现课程 ${icon('arrow')}</a></div>`}`;}
  function ensureRecord(c,v,s,d){const key=recordKey(c,v);let r=records[key];if(!r||r.signature!==s.signature){r={signature:s.signature,filename:s.name,duration:d,position:0,ranges:[],updatedAt:Date.now(),sourceType:s.local?'local':'url'};records[key]=r;}r.duration=d;return r;}
  function paintProgress(c,v,r){const pct=Math.floor(ratio(r)*100),label=query('#lc-watched-label'),bar=query('#lc-watched-bar');if(label)label.textContent=(pct>=90?'已完成 · ':'')+'已观看 '+pct+'%';if(bar)bar.style.width=pct+'%';document.querySelectorAll('.lc-lesson-row[data-video="'+v.id+'"]').forEach(el=>{const small=el.querySelector('em');if(small)small.textContent=pct>=90?'已完成':pct?'已观看 '+pct+'%':'未观看';const n=el.querySelector('.lc-lesson-number');if(n&&pct>=90){n.textContent='✓';n.classList.add('done');}});}
  function savePlayback(el,force=true){if(!active||el!==activeEl)return;const {course:c,video:v}=active,s=source(v),d=Number(el.duration);if(!s||!Number.isFinite(d)||d<=0)return;const r=ensureRecord(c,v,s,d),ranges=[];try{for(let i=0;i<el.played.length;i++)ranges.push([el.played.start(i),el.played.end(i)]);}catch{}r.ranges=mergeRanges([...r.ranges,...ranges],d);r.position=Math.min(d,Math.max(0,Number(el.currentTime)||0));r.updatedAt=Date.now();recent[c.id]={videoId:v.id,updatedAt:r.updatedAt};metadata[v.id]={signature:s.signature,duration:d,filename:s.name};paintProgress(c,v,r);if(force||Date.now()-lastWrite>1200){persist();lastWrite=Date.now();}}
  function beforeRender(){saveSimulationClock();practiceRun++;clearTimeout(searchTimer);if(activeEl){savePlayback(activeEl);const el=activeEl;activeEl=null;try{el.pause();}catch{}}}
  function afterRender(route){renderedView=route.view;const benefitBar=query('.lc-classroom-benefits'),lessonLayout=query('.lc-video-course-layout');if(benefitBar&&lessonLayout){const height=benefitBar.getBoundingClientRect().height;lessonLayout.style.setProperty('--lc-benefit-sticky-offset',(height+24)+'px');}if(route.view!=='learn'){if(simulationActiveKey){const previous=demoPlayers.get(simulationActiveKey);if(previous?.phase==='playing')previous.phase='paused';simulationActiveKey=null;}active=null;return;}const c=courseBy(route.id);if(!c||!active)return;if(!source(active.video))rememberBrowse(c,active.video);const el=query('#lc-video-player');if(!el){startSimulation(c,active.video);return;}if(simulationActiveKey){const previous=demoPlayers.get(simulationActiveKey);if(previous?.phase==='playing')previous.phase='paused';simulationActiveKey=null;}activeEl=el;const v=active.video,s=source(v);if(!s)return;let restored=false;
    const onMeta=()=>{if(activeEl!==el||!Number.isFinite(el.duration)||el.duration<=0)return;const old=record(c,v),position=old?.signature===s.signature?Number(old.position)||0:0;const r=ensureRecord(c,v,s,el.duration);metadata[v.id]={signature:s.signature,duration:el.duration,filename:s.name};const label=query('#lc-duration-label');if(label)label.textContent=formatTime(el.duration);if(!restored&&position>0&&position<el.duration-.5){try{el.currentTime=position;}catch{}}restored=true;const status=query('#lc-playback-status');if(status)status.textContent=position>0?'已恢复至 '+formatPosition(position):'准备就绪，点击播放开始学习';paintProgress(c,v,r);write(keys.metadata,metadata);};
    el.addEventListener('loadedmetadata',onMeta);if(el.readyState>=1)onMeta();
    el.addEventListener('timeupdate',()=>savePlayback(el,false));el.addEventListener('pause',()=>savePlayback(el));el.addEventListener('ended',()=>savePlayback(el));
    el.addEventListener('play',()=>{if(activeEl!==el)return;recent[c.id]={videoId:v.id,updatedAt:Date.now()};write(keys.recent,recent);const status=query('#lc-playback-status');if(status)status.textContent='正在学习 · '+s.name;});
    el.addEventListener('error',()=>{if(activeEl!==el)return;const box=query('#lc-media-error');if(box)box.hidden=false;const status=query('#lc-playback-status');if(status)status.textContent='播放失败，请检查文件或编码格式';});
  }
  function normalizedName(name){return String(name||'').normalize('NFC').trim().toLowerCase();}
  function filenameMatches(v,name){return [v.filename,...safeArray(v.alternateFilenames)].some(f=>normalizedName(f)===normalizedName(name));}
  function cancelImports(){importEpoch++;for(const cancel of [...pendingProbes])cancel();pendingProbes.clear();}
  // A file is committed only after a finite duration and an initial video frame
  // can be read. This checks the opening of the media, not every frame of a movie.
  function probeFile(file){return new Promise(resolve=>{
    let el,url,finished=false,timer;
    const finish=(valid,reason)=>{if(finished)return;finished=true;clearTimeout(timer);pendingProbes.delete(cancel);const d=el?Number(el.duration):0;
      if(el){el.removeEventListener('loadeddata',onData);el.removeEventListener('error',onError);try{el.pause();el.removeAttribute('src');el.load();}catch{}}
      if(!valid&&url)URL.revokeObjectURL(url);resolve({valid,reason,url:valid?url:null,duration:valid?d:null});};
    const cancel=()=>finish(false,'cancelled');
    const onError=()=>finish(false,'unreadable');
    const onData=()=>{const d=Number(el.duration);finish(Number.isFinite(d)&&d>0&&el.videoWidth>0&&el.videoHeight>0,'unreadable');};
    try{url=URL.createObjectURL(file);el=document.createElement('video');el.preload='auto';el.muted=true;el.playsInline=true;el.addEventListener('loadeddata',onData);el.addEventListener('error',onError);pendingProbes.add(cancel);timer=setTimeout(()=>finish(false,'timeout'),15000);el.src=url;el.load();}catch{finish(false,'unreadable');}
  });}
  async function bindFiles(files,targetId){
    const selected=Array.from(files||[]);if(!selected.length)return;cancelImports();const epoch=importEpoch;
    const matches=new Map(),unmatched=[],duplicates=[];
    for(const f of selected){const eligible=targetId?[videoBy(targetId)].filter(Boolean):videos;const matched=eligible.filter(v=>filenameMatches(v,f.name));if(matched.length!==1){unmatched.push(f.name);continue;}const v=matched[0];if(matches.has(v.id)){duplicates.push(v.id);continue;}matches.set(v.id,{file:f,video:v});}
    duplicates.forEach(id=>matches.delete(id));
    if(!matches.size){toast(duplicates.length?'同一节选择了多个版本，请只保留一个。':'文件名与课程清单不匹配，未绑定任何视频。');return;}
    toast(`正在读取 ${matches.size} 节视频，请稍候。`);
    const entries=[...matches],results=[];let cursor=0;
    await Promise.all(Array.from({length:Math.min(3,entries.length)},async()=>{while(cursor<entries.length&&epoch===importEpoch){const [id,item]=entries[cursor++];const probe=await probeFile(item.file);results.push({id,...item,...probe});}}));
    if(epoch!==importEpoch){results.forEach(r=>{if(r.valid&&r.url)URL.revokeObjectURL(r.url);});return;}
    const accepted=results.filter(r=>r.valid),failed=results.filter(r=>!r.valid);
    if(!accepted.length){toast(failed.some(r=>r.reason==='timeout')?'视频读取超时，原有视频与学习记录已保留。':'无法读取视频首帧，请检查文件或编码；原有视频与学习记录已保留。');return;}
    beforeRender();let changed=false;
    for(const {id,file,video,url,duration:d} of accepted){const signature=['file',file.name,file.size,file.lastModified].join(':');const old=localMedia.get(id);if(old?.url)URL.revokeObjectURL(old.url);localMedia.set(id,{url,signature,name:file.name,local:true});for(const c of courses){const key=recordKey(c,video);if(records[key]&&records[key].signature!==signature){delete records[key];changed=true;}}metadata[id]={signature,duration:d,filename:file.name};}
    persist();render();toast(`已接入 ${accepted.length} 节视频${failed.length?`，${failed.length} 节读取失败，保留原记录`:''}${unmatched.length?`，${unmatched.length} 个文件名未匹配`:''}${duplicates.length?'；重复版本未绑定':''}${changed?'；新版本进度重新记录':''}`);
  }
  function handleAction(button,event){const action=button.dataset.action;if(!action?.startsWith('learn-'))return false;const c=courseBy(button.dataset.course);switch(action){
    
    case 'learn-demo-play':if(c){const v=videoBy(button.dataset.video);if(v){const state=demoState(c,v);if(demoPhase(state)==='locked')break;saveSimulationClock();if(demoPhase(state)==='ended'||state.position>=SIM_DURATION)state.position=0;state.override='default';state.phase='playing';render();}}break;
    case 'learn-demo-pause':if(c){const v=videoBy(button.dataset.video);if(v){saveSimulationClock();demoState(c,v).phase='paused';render();}}break;
    case 'learn-demo-retry':if(c){const v=videoBy(button.dataset.video);if(v){const state=demoState(c,v),token=++state.retry;state.override='loading';render();setTimeout(()=>{if(state.retry!==token||!demoPlayers.has(demoKey(c,v)))return;state.override='default';state.phase='idle';if(active?.course.id===c.id&&active?.video.id===v.id)render();},650);}}break;
    case 'learn-retry-catalog':{const token=++catalogRetryToken;catalogOverride='loading';render();setTimeout(()=>{if(token!==catalogRetryToken)return;catalogOverride='default';if(renderedView==='courses')render();},650);}break;
    case 'learn-remove':if(c&&plans.includes(c.id)){if(removingCourseId!==c.id){removingCourseId=c.id;render();}else{plans=plans.filter(id=>id!==c.id);write(keys.plans,plans);removingCourseId=null;render();toast('已移出我的课程，学习与实践记录保留');}}break;
    case 'learn-cancel-remove':removingCourseId=null;render();break;
    case 'learn-copy-practice':runPractice(button);break;
    case 'learn-real-retry':{const el=query('#lc-video-player'),error=query('#lc-media-error');if(el){if(error)error.hidden=true;el.load();toast('正在重新加载视频');}}break;
    case 'learn-start':if(c){if(!plans.includes(c.id)){plans.push(c.id);write(keys.plans,plans);toast('已加入我的课程');render();}else go(learningLink(c));}break;
    case 'learn-open':if(c)go(learningLink(c,button.dataset.video));break;
    case 'learn-category':filter.category=button.dataset.category;render();break;
    case 'learn-clear':filter={category:'全部',q:''};render();break;
    case 'learn-select-file':{const input=query('#lc-single-file');if(input){input.dataset.video=button.dataset.video;input.value='';input.click();}}break;
    case 'learn-select-batch':{const input=query('#lc-batch-files');if(input){input.value='';input.click();}}break;
  }return true;}
  document.addEventListener('input',event=>{if(event.target.id==='lc-sim-range'){const c=courseBy(event.target.dataset.course),v=videoBy(event.target.dataset.video);if(c&&v){const state=demoState(c,v);state.position=Math.max(0,Math.min(SIM_DURATION,Number(event.target.value)||0));if(state.startedAt!==null)state.startedAt=Date.now();const label=query('#lc-sim-time');if(label)label.textContent=simTime(state.position)+' / 0:30';if(state.position>=SIM_DURATION){saveSimulationClock();state.phase='ended';render();}else if(demoPhase(state)==='ended'){state.override='default';state.phase='paused';render();}}return;}if(event.target.id==='lc-practice-prompt'){practiceDrafts[event.target.dataset.video]=event.target.value;write(keys.drafts,practiceDrafts);return;}if(event.target.id!=='lc-course-search')return;filter.q=event.target.value;const start=event.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const input=query('#lc-course-search');if(input){input.focus();try{input.setSelectionRange(start,start);}catch{}}},180);});
  document.addEventListener('change',event=>{const input=event.target;if(!input.dataset?.lcFile)return;return bindFiles(input.files,input.dataset.lcFile==='single'?input.dataset.video:null);});
  window.addEventListener('pagehide',()=>{if(activeEl)savePlayback(activeEl);});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&activeEl)savePlayback(activeEl);});
  function reset(){cancelImports();beforeRender();demoPlayers.clear();simulationActiveKey=null;removingCourseId=null;catalogOverride=null;catalogRetryToken++;localMedia.forEach(s=>URL.revokeObjectURL(s.url));localMedia=new Map();plans=[];records={};recent={};metadata={};browsing={};practiceDrafts={};active=null;filter={category:'全部',q:''};persist();}
  return {home,detail,learn,myCourses,handleAction,beforeRender,afterRender,reset};
};

  <script>
/* Editable research preferences. No identity or institution is prefilled. */
window.createResearchProfile = function createResearchProfile(deps) {
  'use strict';
  const {esc,icon,btn,read,write,toast,go,render,onSave,cases=[],getScenario=()=> 'default'}=deps;
  const KEY='researchCard';
  const disciplines=['地球科学','材料科学','生命科学','计算机科学','化学','物理学','数学','其他'];
  const roles=['本科生','硕士','博士','教师','科研人员','其他'];
  const tasks=[...new Set([...cases.map(c=>c.task).filter(Boolean),'文献调研','科研写作','方法沉淀'])];
  const levels=['入门','进阶'];
  const aliases={地球:'地球科学',材料:'材料科学',生命:'生命科学',计算机:'计算机科学',物理:'物理学'};
  const $=selector=>document.querySelector(selector);
  const text=(value,limit)=>typeof value==='string'?value.trim().slice(0,limit):'';
  function normalize(raw){
    const x=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
    return {
      disciplines:[...new Set((Array.isArray(x.disciplines)?x.disciplines:[]).map(d=>aliases[d]||d).filter(d=>disciplines.includes(d)))],
      role:roles.includes(x.role)?x.role:'',
      institution:text(x.institution,100),department:text(x.department,100),direction:text(x.direction,200),
      task:tasks.includes(x.task)?x.task:'',level:levels.includes(x.level)?x.level:'入门',
      updatedAt:Number.isFinite(x.updatedAt)&&x.updatedAt>0?x.updatedAt:null
    };
  }
  const copy=card=>({...card,disciplines:[...card.disciplines]});
  let saved=normalize(read(KEY,null)),draft=copy(saved),clearPending=false,validationMessage='';
  const complete=card=>card.disciplines.length>0&&!!card.role&&!!card.task;
  const hasSavedCard=()=>saved.disciplines.length>0||!!(saved.role||saved.institution||saved.department||saved.direction||saved.task);
  function get(){return copy(saved);}
  function isComplete(){return complete(saved);}
  function savedUnchanged(){const clean=card=>({...normalize(card),updatedAt:null});return !!saved.updatedAt&&JSON.stringify(clean(saved))===JSON.stringify(clean(draft));}
  function saveStatusMarkup(){return `<div id="member-save-state" class="rp-save-state" role="status" ${savedUnchanged()?'':'hidden'}>${icon('check')}研究名片已保存，推荐会使用这些偏好。</div>`;}
  function paintSaveStatus(){const el=$('#member-save-state');if(el)el.hidden=!savedUnchanged();}
  function summary(){if(!saved.disciplines.length&&!saved.role&&!saved.task)return '完善研究名片';const scope=saved.disciplines.length?saved.disciplines[0]+(saved.disciplines.length>1?' +'+(saved.disciplines.length-1):''):'';return [scope,saved.role||saved.task].filter(Boolean).join(' · ');}
  function pill(label,action,value,selected){return `<button type="button" class="rp-choice ${selected?'selected':''}" data-action="${action}" data-value="${esc(value)}" aria-pressed="${selected}">${esc(label)}${selected?icon('check'):''}</button>`;}
  function cardPreview(){
    const d=normalize(draft),filled=complete(d);
    return `<div class="rp-card-top"><span>RESEARCH CARD</span><span class="rp-card-status">${filled?'推荐偏好已就绪':'由你来定义'}</span></div><div class="rp-card-symbol">${icon('user')}</div><h2>${esc(d.role||'你的研究名片')}</h2>${d.institution||d.department?`<p class="rp-card-affiliation">${esc([d.institution,d.department].filter(Boolean).join(' · '))}</p>`:'<p class="rp-card-affiliation">让科研内容更贴近你的需要</p>'}<div class="rp-card-disciplines">${d.disciplines.length?d.disciplines.map(x=>`<span>${esc(x)}</span>`).join(''):'<span class="rp-card-awaiting">选择你关注的学科</span>'}</div>${d.direction?`<p class="rp-card-direction">${esc(d.direction)}</p>`:''}<div class="rp-card-task"><span>当前任务</span><strong>${esc(d.task||'选择这次想解决的问题')}</strong><small>${esc(d.level)} · 可随时切换</small></div><div class="rp-card-bottom">${icon('spark')}课程与 科研实践案例 将参考这些偏好</div>`;
  }

"member-department">院系 / 部门<input id="member-department" data-member-field="department" type="text" maxlength="100" placeholder="选填" autocomplete="off" value="${esc(draft.department)}"></label><label class="rp-text-wide" for="member-direction">具体研究方向<input id="member-direction" data-member-field="direction" type="text" maxlength="200" placeholder="例如：城市热环境、蛋白结构分析（选填）" autocomplete="off" value="${esc(draft.direction)}"></label></div></section>${saveStatusMarkup()}<div id="member-validation" class="rp-validation" role="alert" ${validationMessage?'':'hidden'}>${esc(validationMessage)}</div><div class="rp-form-actions">${btn('保存并查看推荐 '+icon('arrow'),'member-save','type="button"','primary')}${btn('暂不填写，先看看','member-skip','type="button"','rp-skip')}</div><p class="rp-storage-note">本演示仅在当前浏览器保存名片；你可以随时修改。</p>${hasSavedCard()?`<div class="rp-clear-row">${btn(clearPending?'确认清除名片':'清除名片','member-clear','type="button"',clearPending?'rp-clear-button confirming':'rp-clear-button')}${clearPending?`${btn('保留名片','member-cancel-clear','type="button"','rp-clear-cancel')}<p role="status">再次点击确认，只清除研究名片与推荐偏好；课程、实践和贡献记录会保留。</p>`:'<span>仅清除名片与推荐偏好</span>'}</div>`:''}</form><aside class="rp-aside"><section class="rp-preview-card" id="member-card-preview" aria-label="研究名片预览">${cardPreview()}</section><section class="rp-purpose"><h3>为什么填写</h3><p>${icon('book')}优先发现与你学科相关的课程。</p><p>${icon('flask')}按当前任务寻找可借鉴的案例。</p><p>${icon('reset')}研究方向和任务变化后，随时调整。</p><span>名片用于内容推荐，不代表身份认证。</span></section></aside></div>`;}
  function captureText(){for(const field of ['institution','department','direction']){const el=$('#member-'+field);if(el)draft[field]=el.value;}}

  }

    case 'member-discipline':if(disciplines.includes(value)){draft.disciplines=draft.disciplines.includes(value)?draft.disciplines.filter(x=>x!==value):[...draft.disciplines,value];sync();}break;

    case 'member-cancel-clear':clearPending=false;render();break;

  document.addEventListener('input',event=>{const field=event.target.dataset?.memberField;if(!['institution','department','direction'].includes(field))return;draft[field]=event.target.value;const preview=$('#member-card-preview');if(preview)preview.innerHTML=cardPreview();paintSaveStatus();});

  <script>

window.createContributions = function createContributions(deps) {

  const TYPES={helpful:'有帮助',error:'信息有误',reproduction:'复现失败',suggestion:'改进建议'};
  const OUTCOMES={success:'成功',failure:'失败',unverified:'待验证'};
  const empty=()=>({version:1,items:[],ledger:[],practiceCourses:{},drafts:{}});
  let state=empty(),resetRequested=false,clearDraftKey=null;
  const pendingSubmissions=new Map(),submissionErrors=new Map(),unsavedDrafts=new Set();
  const needsRevision=item=>['needs_more','rejected','not_adopted'].includes(item.status);
  try {
    const saved=read(KEY,null);
    if(saved&&typeof saved==='object') state={version:1,items:Array.isArray(saved.items)?saved.items.filter(x=>x&&typeof x.id==='string'&&['feedback','practice'].includes(x.kind)&&Object.hasOwn(STATUS,x.status)).map(x=>({...x,supplements:Array.isArray(x.supplements)?x.supplements:[],timeline:Array.isArray(x.timeline)?x.timeline:[]})):[],ledger:Array.isArray(saved.ledger)?saved.ledger.filter(x=>x&&typeof x.key==='string'&&Number.isFinite(x.amount)&&x.amount>0).map(x=>({...x,kind:ledgerKind(x)})):[],practiceCourses:saved.practiceCourses&&typeof saved.practiceCourses==='object'?saved.practiceCourses:{},drafts:saved.drafts&&typeof saved.drafts==='object'&&!Array.isArray(saved.drafts)?saved.drafts:{}};
  } catch (_) { state=empty(); }
  const caseBy=id=>cases.find(x=>x.id===id);
  const videoBy=id=>videos.find(x=>x.id===id);
  const courseBy=id=>courses.find(x=>x.id===id);
  const itemBy=id=>state.items.find(x=>x.id===id);
  const text=(value,max=5000)=>typeof value==='string'?value.slice(0,max):'';
  const date=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'时间未记录':d.toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});};
  const time=()=>new Date().toISOString();
  const newId=()=>('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
  const normalize=value=>String(value||'').trim().replace(/\s+/g,' ').toLowerCase();
  function safeUrl(value) {try {const u=new URL(String(value||'').trim());return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch(_){return '';}}
  const link=(url,label)=>safeUrl(url)?`<a class="contribution-source-url" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(label||url)} ${icon('arrow')}</a>`:'';
  const button=(label,action,attrs='',style='')=>`<button type="button" class="btn ${style}" data-action="contribution-${action}" ${attrs}>${label}</button>`;
  const plain=(label,action,attrs='')=>`<button type="button" class="plain-link" data-action="contribution-${action}" ${attrs}>${label}</button>`;
  const earned=id=>state.ledger.filter(x=>x.contributionId===id).reduce((n,x)=>n+x.amount,0);
  const balance=()=>state.ledger.reduce((n,x)=>n+x.amount,0);
  const REWARD_KINDS={lesson:'课时学习',series:'系列结课',contribution:'案例贡献',adoption:'采纳追加'};
  function ledgerKind(row){if(['lesson','series','contribution','adoption'].includes(row.kind))return row.kind;if(row.key?.startsWith('learn:'))return 'lesson';if(row.key?.startsWith('series:'))return 'series';return row.key?.endsWith(':adopted')?'adoption':'contribution';}
  const isLearningReward=row=>['lesson','series'].includes(ledgerKind(row));
  const wallet={
    has(id){return typeof id==='string'&&state.ledger.some(row=>row.key===id);},
    credit(input){
      if(!input||typeof input!=='object'||Array.isArray(input))return {ok:false,error:'奖励信息无效。'};
      const {id,kind,amount,courseId,videoId}=input,c=courseBy(courseId);
      if(!c||!['lesson','series'].includes(kind))return {ok:false,error:'课程或奖励类型无效。'};

      if(kind==='lesson'){
        const v=videoBy(videoId);if(!v||!c.modules?.some(m=>m.videoId===videoId))return {ok:false,error:'课时不属于当前课程。'};
        expected='learn:'+courseId+':'+videoId;label=v.title+' · 课时学习';
      }else{if(videoId!==undefined&&videoId!==null&&videoId!=='')return {ok:false,error:'系列奖励不能绑定单个课时。'};expected='series:'+courseId;label=c.title+' · 系列结课';}
      if(id!==expected)return {ok:false,error:'奖励标识与课程来源不一致。'};
      if(wallet.has(id))return {ok:true,duplicate:true};
      if(!Number.isFinite(balance()+amount)||balance()+amount>Number.MAX_SAFE_INTEGER)return {ok:false,error:'奖励金额超出可记录范围。'};
      const row={key:id,kind,amount,label:text(input.label,180).trim()||label,courseId,at:time(),isDemo:true};
      if(kind==='lesson')row.videoId=videoId;
      if(!commit(()=>state.ledger.unshift(row),{silent:true}))return {ok:false,error:'浏览器未能保存墨点记录，领取资格保留，请重试。'};
      return {ok:true};
    },
    entries(){return JSON.parse(JSON.stringify(state.ledger.map(row=>({...row,kind:ledgerKind(row)}))));}
  };
  function counts(){return {total:state.items.length,pending:state.items.filter(x=>x.status==='pending').length,needsMore:state.items.filter(x=>x.status==='needs_more').length,needsAction:state.items.filter(needsRevision).length,rejected:state.items.filter(x=>x.status==='rejected').length,effective:state.items.filter(x=>x.status==='effective').length,notAdopted:state.items.filter(x=>x.status==='not_adopted').length,adopted:state.items.filter(x=>x.status==='adopted').length,drafts:Object.keys(state.drafts).length,balance:balance()};}
  function commit(change,{silent=false}={}) {
    const previous=JSON.stringify(state);

  }
  function reset({all=false}={}){const ok=commit(()=>{const learning=all?[]:state.ledger.filter(isLearningReward);state={...empty(),ledger:learning};});if(ok){resetRequested=false;clearDraftKey=null;pendingSubmissions.clear();submissionErrors.clear();unsavedDrafts.clear();}return ok;}
  function resetControl(){return `<section class="contribution-reset">${resetRequested?`<div role="alert"><strong>确认清空本机贡献记录？</strong><p>将清除贡献草稿、已提交材料、核验时间线及对应的贡献奖励。课时学习与系列结课奖励、课程进度、个人名片会保留。</p><div class="button-row">${button('确认清空贡献及其奖励','reset-confirm','','small')}${button('取消','reset-cancel','','small')}</div></div>`:plain('清空本机贡献记录','reset-start')}</section>`;}
  function sourceCourse(videoId){const selected=courseBy(state.practiceCourses[videoId]);if(selected?.modules?.some(m=>m.videoId===videoId))return selected;return courses.find(c=>c.id!=='science-intelligence'&&c.modules?.some(m=>m.videoId===videoId))||courses.find(c=>c.modules?.some(m=>m.videoId===videoId));}
  function contextFor(caseId) {
    let c;try{c=typeof getCaseContext==='function'?getCaseContext(caseId):null;}catch(_){c=null;}
    const hasRun=c?.hasRun===true;
    let params=null;try{params=hasRun&&c.params&&typeof c.params==='object'?JSON.parse(JSON.stringify(c.params)):null;}catch(_){}
    return {caseId,title:caseBy(caseId)?.title||text(c?.title),version:text(c?.version,100)||null,hasRun,params,fingerprint:hasRun?text(c?.fingerprint,200)||null:null};
  }
  function contextMarkup(c){return `<div class="contribution-context"><strong>附带的复现上下文</strong><span>版本：${esc(c?.version||'未提供')}</span><span>${c?.hasRun?'已在本机运行':'本机尚未运行，不附带运行参数或结果指纹'}</span>${c?.hasRun&&c.params?`<code>${esc(JSON.stringify(c.params))}</code>`:''}${c?.hasRun&&c.fingerprint?`<span>结果指纹：<code>${esc(c.fingerprint)}</code></span>`:''}</div>`;}
  function sourceLink(item){if(item.source?.caseId&&caseBy(item.source.caseId))return '#case/'+encodeURIComponent(item.source.caseId);if(item.source?.courseId&&courseBy(item.source.courseId))return '#course/'+encodeURIComponent(item.source.courseId);return '#courses';}
  function badge(item){return `<span class="contribution-badge ${esc(item.status)}">${STATUS[item.status]}</span>`;}
  const demoNotice=()=>`<div class="contribution-notice">${icon('info')}<span><strong>本机演示</strong> · 提交、审核与墨点记录仅保存在当前浏览器，不实际发送给运营，不代表真实到账或学分。</span></div>`;
  function pageHeader(title,description){return `<div class="page-header"><div><h1>${title}</h1><p>${description}</p></div><a class="plain-link" href="#rewards">演示墨点 ${balance()} ${icon('arrow')}</a></div>`;}
  function navigation(){return '';}
  function field(label,name,{value='',placeholder='',rows=3,max=2000,required=false,note='',input=false}={}){const id='contribution-'+name;return `<div class="contribution-field"><label for="${id}">${label}${required?'<span aria-hidden="true"> *</span>':''}</label>${input?`<input id="${id}" name="${name}" type="text" maxlength="${max}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?'aria-required="true"':''}>`:`<textarea id="${id}" name="${name}" rows="${rows}" maxlength="${max}" placeholder="${esc(placeholder)}" ${required?'aria-required="true"':''}>${esc(value)}</textarea>`}${note?`<small>${note}</small>`:''}</div>`;}
  function select(label,name,options,selected){return `<div class="contribution-field"><label for="contribution-${name}">${label}</label><select id="contribution-${name}" name="${name}">${Object.entries(options).map(([v,t])=>`<option value="${v}" ${v===selected?'selected':''}>${t}</option>`).join('')}</select></div>`;}
  function submissionAside(kind){return `<aside class="panel contribution-aside"><h3>留下什么最有价值</h3><ul class="check-list"><li>${icon('check')}说清问题和操作过程</li><li>${icon('check')}记录预期与实际差异</li><li>${icon('check')}提供可以检查的材料</li></ul><div class="aside-label">演示奖励规则</div><p>核验有效后：${kind==='feedback'?'反馈 +20':'完整实践 +50'} 演示墨点；被采纳再 +30。提交时不发奖。</p><p>成功、失败和待验证的实践使用相同核验标准与奖励额度。</p><p class="sample-notice">演示额度，实际规则待定。材料与证据优先于结果是否成功。</p><a href="#rewards" class="plain-link">查看完整规则 ${icon('arrow')}</a></aside>`;}
  const draftKey=(kind,resource)=>kind+':'+resource;
  const validSource=(kind,resource)=>kind==='feedback'?caseBy(resource):kind==='practice'?videoBy(resource):null;
  const draftFields={summary:180,question:1200,method:3500,expected:1500,actual:2500,steps:2500,evidence:4000,sourceUrl:1800};
  function draftFor(kind,resource){const raw=state.drafts[draftKey(kind,resource)],d=raw&&typeof raw==='object'?raw:{};return {...Object.fromEntries(Object.entries(draftFields).map(([name,max])=>[name,text(d[name],max)])),type:Object.hasOwn(TYPES,d.type)?d.type:'helpful',outcome:Object.hasOwn(OUTCOMES,d.outcome)?d.outcome:'unverified',consentInternal:d.consentInternal===true,consentPublic:d.consentPublic===true,updatedAt:text(d.updatedAt,80)};}

  function preview(version){const c=caseBy(version.caseId);try{if(c&&digest(c,version.params)===version.fingerprint&&JSON.stringify(sample(c,version.params))===JSON.stringify(version.sampleData))return `<div class="project-result-chart">${chart(c,version.params,false)}</div>`;}catch(_){}return '<p class="project-muted">当前预览版本与存档不一致；以已保存的数据与参数为准。</p>';}

  function exportAsset(){const p=projectBy(dialog?.projectId),a=assetBy(p,dialog?.assetId),v=a?.versions.find(x=>x.id===dialog.versionId)||latest(a||{versions:[]});if(!p||!a||!v)return;try{const payload={schema:'duanyan-project-asset/v1',project:{id:p.id,name:p.name},asset:{id:a.id,name:a.name,caseId:a.caseId,versionNumber:a.versions.indexOf(v)+1},...clone(v),note:a.kind==='manual'?'本机手动归集材料，未写入线上课题空间；内容尚未核验。':'本机演示存档，未写入线上课题空间；数据为前端合成。'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=(a.name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'-').slice(0,60)||'practice')+'-v'+(a.versions.indexOf(v)+1)+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出该版本的数据、参数、结果与方法说明');}catch(_){toast('导出失败，请重试。');}}
  function createProject(){if(!mayWrite()||dialog?.type!=='create')return;const name=value('name'),description=value('description'),error=nameError(name,'课题名称',activeProjects());if(error){dialogError(error);return;}const p={id:uid('p'),name,description,createdAt:now(),updatedAt:now(),assets:[]};if(commit(()=>state.projects.unshift(p))){closeDialog();go('#workspace/'+p.id);toast('已创建本机课题');}}

  function handleAction(b,event){const action=b.dataset.action;if(!action?.startsWith('project-'))return false;event?.preventDefault();const id=b.dataset.id,pid=b.dataset.project;

  function afterRender(route){const c=courseBy(route?.id);renderedCourseId=c?.id||null;if(!c)return;const name=document.getElementById('benefits-certificate-name');if(name)name.oninput=()=>{nameDrafts[c.id]=String(name.value||'').slice(0,40);};QUESTIONS.forEach(q=>q.options.forEach(([value])=>{const el=document.getElementById(`benefits-${q.id}-${value}`);if(el)el.onchange=()=>capture(c);}));}

  function labContent(c){const l=lab(c),dirty=JSON.stringify(l.pending)!==JSON.stringify(l.applied);return `<h3>复现结果，然后改变一个条件</h3><p>先运行默认参数，再调整输入；对比结果后，可将数据与运行记录存入课题空间。</p><fieldset class="case-control-fields" ${l.busy?'disabled':''}><div class="control-grid">${controls(c,l)}</div></fieldset><div class="button-row">${btn(icon('reset')+'复现默认结果','reproduce',`data-id="${c.id}" ${l.busy?'disabled':''}`)}${btn(l.busy?'<span class="run-busy"><span class="demo-loading"></span>正在运行</span>':icon('play')+'运行并对比','run',`data-id="${c.id}" ${l.busy?'disabled':''}`,'primary')}${l.busy?btn('取消运行','cancel-run','','small'):''}</div><div class="status-line ${l.runError?'run-error':dirty?'pending':''}" role="status">${icon(l.runError||dirty?'info':'check')}<span>${l.busy?'正在根据当前输入生成结果…':l.runError?esc(l.runError):dirty?'参数已改变，运行后更新结果。':l.hasRun?`已完成运行 · 结果指纹 ${digest(c,l.applied)}`:'当前为结果预览，运行后才能保存到课题空间。'}</span></div>${l.runError?btn('重试本次运行','retry-run','','small'):''}${l.compare?`<div class="compare-grid">${plot(c,defaults(c),'默认结果')}${plot(c,l.applied,'本次结果')}</div>`:plot(c,l.applied,l.hasRun?'已运行结果':'默认预览')}<div class="plot-stats"><span>数据来源 <b>内置合成数据</b></span><span>方法版本 <b>demo-v1.0</b></span>${l.hasRun?'<span>相同输入 <b>结果可重复</b></span>':''}</div><p class="sample-notice">${c.summary}本次运行使用本地合成数据，未调用外部计算环境。</p>`;}
  function materials(c){return `<h3>让一次探索有据可循</h3><p>每个案例保留输入、参数、方法版本和结果。演示数据可下载，后续接入真实案例时采用同一份材料结构。</p><div class="material-item"><div><strong>数据与运行参数</strong><small>JSON · 合成样本、参数、来源、版本与结果指纹</small></div>${btn(icon('download')+'下载','download',`data-id="${c.id}"`,'small')}</div><div class="material-item"><div><strong>环境与依赖</strong><small>现代浏览器 · 无需登录或外部算力 · 无随机数调用</small></div><span class="tag">本地计算</span></div><div class="material-item"><div><strong>复现步骤</strong><small>打开交互复现 → 恢复默认参数 → 运行 → 比对结果指纹</small></div></div><pre class="code-sample">案例：${esc(c.id)}\n方法版本：demo-v1.0\n默认参数：${esc(JSON.stringify(defaults(c),null,2))}\n默认数据指纹：${digest(c,defaults(c))}\n数据生成：固定索引与三角函数，无外部数据请求\n完整计算逻辑：同目录 app.js / 单文件 HTML 内置脚本</pre><p class="sample-notice">真实案例上线前需补充数据授权、依赖锁定、参考结果与独立复跑记录。</p>`;}
  function caseView(c){const l=lab(c);return `<a class="back" href="#showcases">${icon('back')}返回 科研实践案例</a><div class="detail-header"><div class="eyebrow">${c.discipline} / ${c.task}<span class="tag">${c.sourceRole}样例</span></div><h1>${c.title}</h1><p>${c.question}</p><div class="detail-meta"><span>${c.level} · 约 ${c.minutes} 分钟</span><span>${c.method}</span><span>演示版本 v1.0</span></div></div><div class="case-feedback-shortcut"><a class="btn small" href="#contribute/feedback/${c.id}">${icon('spark')}反馈这个案例</a><p>有帮助、信息有误或复现失败，都可以反馈。</p></div><div class="detail-grid"><section class="panel"><nav class="tabs detail-tabs" aria-label="案例详情">${[['overview','案例概览'],['lab','交互复现'],['materials','复现材料']].map(([id,t])=>`<button class="tab ${state.caseTab===id?'active':''}" data-action="case-tab" data-tab="${id}">${t}</button>`).join('')}</nav><div style="margin-top:22px">${state.caseTab==='lab'?labContent(c):state.caseTab==='materials'?materials(c):`<h3>一个问题，一条可实践的路径</h3><p>${c.question}这个示例把问题、输入和图形放在一起，帮助你观察参数变化，并组织自己的解释。</p>${plot(c,defaults(c),'结果预览')}<h3 class="case-overview-title">在这个案例中，你可以</h3><ul class="check-list"><li>${icon('check')}用相同参数重新生成默认结果</li><li>${icon('check')}修改输入条件，比较前后差异</li><li>${icon('check')}保留数据与参数，将成果存入课题空间</li></ul><div class="button-row">${btn('开始交互复现 '+icon('arrow'),'case-tab','data-tab="lab"','primary')}</div><p class="sample-notice">${c.summary}</p>`}</div></section><aside class="panel aside-panel"><h3>继续你的探索</h3><p style="font-size:11px">将本次输入、运行参数与结果归入课题，和已有资料一起持续积累。</p>${btn(icon('folder')+'保存到课题空间','save-asset',`data-id="${c.id}" ${l.hasRun&&!l.busy?'':'disabled'} `,'primary full')}<p style="font-size:10px;margin-top:8px">${l.hasRun?'选择已有课题或新建课题，保存本次已运行结果。':'完成一次运行后，可将数据、参数和结果存入课题。'}</p><div class="aside-label">关联课程</div>${c.courseIds.map(id=>{const x=courseBy(id);return `<a class="course-linked" href="#course/${id}">${icon('book')}<div><strong>${x.title}</strong><span>返回课程，补充方法 ${'→'}</span></div></a>`;}).join('')}<div class="aside-label">案例标签</div><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><p class="sample-notice">课题中的资料默认仅自己可见。整理后的成果可提交案例，经核验与授权后公开。</p></aside></div>${contributions.casePanel(c.id)}`;}
  function render(){
    const r=route();courseLearning?.beforeRender();contributions?.beforeRender?.();researchProfile?.beforeRender?.();projectSpace?.beforeRender?.();learningBenefits?.beforeRender?.();let content;
    if(r.view==='course'&&courseBy(r.id))content=courseView(courseBy(r.id));
    else if(r.view==='learn'&&courseBy(r.id))content=courseLearning.learn(courseBy(r.id),r.resource);
    else if(r.view==='my-courses')content=courseLearning.myCourses();
    else if(['completion','certificate'].includes(r.view)&&courseBy(r.id))content=learningBenefits.view(r);
    else if(r.view==='profile')content=communityNav(r.view)+researchProfile.view();
    else if(['contribute','contributions','rewards'].includes(r.view))content=communityNav(r.view)+contributions.view(r);
    else if(r.view==='case'&&caseBy(r.id))content=caseView(caseBy(r.id));
    else if(r.view==='workspace')content=projectSpace.view(r);
    else if(r.view==='showcases')content=gallery();else if(r.view==='courses')content=home();else content=`<div class="demo-state"><h2>没有找到这个页面</h2><p>课程或案例可能已调整，请从首页继续。</p><a class="btn primary" href="#courses">返回课程首页</a></div>`;
    $('#app').innerHTML=shell(content,r.view);courseLearning?.afterRender(r);contributions?.afterRender?.(r);researchProfile?.afterRender?.(r);projectSpace?.afterRender?.(r);learningBenefits?.afterRender?.(r);demoStates?.paint();
    document.title=((r.view==='course'||r.view==='learn')?courseBy(r.id)?.title:r.view==='case'?caseBy(r.id)?.title:r.view==='completion'?'奖励与结业':r.view==='certificate'?'课程结业证书':r.view==='workspace'?'课题空间':r.view==='my-courses'?'我的课程':r.view==='profile'?'研究名片':r.view==='rewards'?'我的墨点':['contribute','contributions'].includes(r.view)?'我的贡献':'课程与实践')+' · 书生端砚';
  }

  function exportData(c){const l=lab(c);const payload={caseId:c.id,title:c.title,version:'demo-v1.0',dataSource:'合成演示数据；不是真实科研数据',params:l.applied,resultFingerprint:digest(c,l.applied),sampleData:sample(c,l.applied),display:{kind:c.kind,scheme:l.applied.scheme||'field'},note:'使用同一版HTML恢复这些参数，可重新生成同一结果。'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=c.id+'-reproduction.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出数据、参数和来源记录');}
  function syncResearchCard(card){const disciplines=Array.isArray(card?.disciplines)?card.disciplines:[];state.profile=disciplines.length?{id:'research-card',discipline:disciplines[0],disciplines:[...disciplines],task:card.task||'',level:card.level||'入门'}:null;write('profile',state.profile);state.page=1;state.filters={discipline:'全部',task:'全部',level:'全部',q:'',sort:'recommended',course:''};}
  function courseRank(c){if(!state.profile)return 0;const methodTask=['文献调研','科研写作','方法沉淀'].includes(state.profile.task);if(c.id==='research-skills')return methodTask?10:4;if(c.id==='data-methods')return profileDisciplines().some(d=>['地球科学','材料科学','生命科学'].includes(d))?8:2;return 1;}
  function courseReason(c){if(!state.profile)return '';if(c.id==='research-skills')return ['文献调研','科研写作','方法沉淀'].includes(state.profile.task)?`适合你的${state.profile.task}任务`:'补充通用科研方法';if(c.id==='data-methods')return profileDisciplines().some(d=>['地球科学','材料科学','生命科学'].includes(d))?'包含你关注的学科应用':'跨学科应用探索';return '高校共建课程 · 综合学习路径';}
  demoStates=window.createDemoStates({esc,icon,render,go,toast,getRoute:route,extraControls:()=>learningBenefits?.demoControls(route())||''});
  researchProfile=window.createResearchProfile({esc,icon,btn,read,write,toast,go,render,cases,onSave:syncResearchCard,getScenario});
  syncResearchCard(researchProfile.get());
  contributions=window.createContributions({esc,icon,btn,read,write,toast,go,render,courses,videos,cases,getScenario,getResearchCard:()=>researchProfile.get(),getCaseContext:id=>{const c=caseBy(id);if(!c)return null;const l=state.labs[id],hasRun=!!l?.hasRun;return {caseId:id,title:c.title,version:'demo-v1.0',hasRun,params:hasRun?{...l.applied}:null,fingerprint:hasRun?digest(c,l.applied):null};}});
  learningBenefits=window.createLearningBenefits({esc,icon,btn,courses,videos,read,write,toast,go,render,getScenario,getRoute:route,wallet:contributions.wallet});
  courseLearning=window.createCourseLearning({esc,icon,btn,courses,videos,practices,cases,caseCard,go,render,read,write,toast,heading,pathRail,courseRank,courseReason,getScenario,benefits:learningBenefits,practiceEntry:(courseId,videoId)=>contributions.practiceEntry(courseId,videoId)});
  projectSpace=window.createProjectSpace({esc,icon,btn,read,write,toast,go,render,cases,chart,sample,digest,defaults,getScenario});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(demoStates.handleAction(b,e)||learningBenefits.handleAction(b,e)||projectSpace.handleAction(b,e)||researchProfile.handleAction(b,e)||contributions.handleAction(b,e)||courseLearning.handleAction(b,e))return;const a=b.dataset.action,id=b.dataset.id;const current=caseBy(route().id);switch(a){
    case 'mobile':state.mobile=!state.mobile;render();break;
    case 'course':state.openModule=0;go('#course/'+id);break;
    case 'case':state.caseTab='overview';go('#case/'+id);break;
    case 'showcases':go('#showcases');break;
    case 'profile':go('#profile');break;
    case 'reset-demo':if(b.dataset.confirmed!=='yes'){b.dataset.confirmed='yes';b.textContent='再次点击，清空本机演示记录';break;}resetDemo();break;
    case 'favorite':state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];write('favorites',state.favorites);render();toast(state.favorites.includes(id)?'已收藏这个案例':'已取消收藏');break;
    case 'course-cases':state.filters={discipline:'全部',task:'全部',level:'全部',q:'',sort:'recommended',course:id};state.page=1;go('#showcases');break;
    case 'filter-discipline':state.filters.discipline=b.dataset.value;state.page=1;render();break;
    case 'clear-filters':state.filters={discipline:'全部',task:'全部',level:'全部',q:'',sort:'recommended',course:''};state.page=1;render();break;
    case 'clear-course':state.filters.course='';state.page=1;render();break;
    case 'next':state.page++;render();window.scrollTo({top:220,behavior:'smooth'});break;
    case 'prev':state.page=Math.max(1,state.page-1);render();window.scrollTo({top:220,behavior:'smooth'});break;
    case 'module':state.openModule=state.openModule===Number(b.dataset.index)?-1:Number(b.dataset.index);render();break;
    case 'complete-module':{const key=b.dataset.course+':'+b.dataset.index;state.completed=state.completed.includes(key)?state.completed.filter(x=>x!==key):[...state.completed,key];write('completed',state.completed);render();break;}
    case 'case-tab':state.caseTab=b.dataset.tab;render();break;
    case 'case-favorites':state.filters.onlySaved=!state.filters.onlySaved;state.page=1;render();break;
    case 'cancel-run':if(current){const l=lab(current);clearTimeout(l.timer);l.busy=false;l.runError='';l.runToken=(l.runToken||0)+1;render();toast('已取消运行，之前的结果保留');}break;
    case 'retry-run':demoStates.set('caseRun','default');if(current)startCaseRun(current,false);break;
    case 'reproduce':if(current)startCaseRun(current,true);break;
    case 'run':if(current)startCaseRun(current,false);break;
    case 'download':exportData(caseBy(id));break;
    case 'save-asset':{const c=caseBy(id);if(!c)break;const l=lab(c);if(!l.hasRun||l.busy)break;demoStates.close();projectSpace.saveCase(c,{...l.applied});break;}
  }});
  let searchTimer;
  document.addEventListener('input',e=>{if(e.target.id==='case-search'){state.filters.q=e.target.value;state.page=1;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const active=document.activeElement?.id==='case-search';const pos=e.target.selectionStart;render();if(active){$('#case-search').focus();try{$('#case-search').setSelectionRange(pos,pos);}catch{}}},160);}});
  document.addEventListener('change',e=>{if(demoStates.handleChange(e))return;const map={'task-filter':'task','level-filter':'level','course-filter':'course','sort-filter':'sort'};if(map[e.target.id]){state.filters[map[e.target.id]]=e.target.value;state.page=1;render();}if(e.target.dataset.param){const c=caseBy(route().id);if(c){lab(c).pending[e.target.dataset.param]=e.target.value;render();}}});
  window.addEventListener('hashchange',()=>{clearTimeout(searchTimer);state.mobile=false;render();window.scrollTo(0,0);});
  render();
})();

</script>
</body>
</html>
